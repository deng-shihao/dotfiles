[flavor]
dark  = "rose-pine-dawn"
light = "rose-pine-dawn"

# Transparent background: don't paint cells, let the terminal background
# (ghostty: background-opacity 0.95 + blur) show through instead.
[app]
overall = { bg = "reset" }

[status]
overall = { bg = "reset" }
